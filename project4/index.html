<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admission Form</title>
</head>
<body>
    <h1>Wainganga College Of Engineering And Management</h1>
    <h2>Admission Form 2026-27</h2>
    <img src="../college.jpg" alt="college image">
    
    <h2>Available Courses</h2>
    <ul>
        <li>B.Tech</li>
        <li>M.Tech</li>
        <li>MBA</li>
        <li>MCA</li>
        <li>Polytechnic Diploma</li>
    </ul>
    <h2>Admission form</h2>
    <form>
        <label>Full Name:</label>
        <input type="text" placeholder="Enter Your Name">
        <br><br>
        <label>Enter Your Mobile No</label>
        <input type="Number" placeholder"Enter your mobile no">
        <br><br>
        <label>Enter Your Email id</label>
        <input type="Email" placeholder"Enter your email id">
        <br><br>
        
        <label> Enter Your Date Of Birth
        </label>
        <input type="date" placeholder="Enter your date of birth">
       </form>
       <label>Gender</label>

       <input type="radio" name="Gender" value="Male">
       <label>Male</label>
       
       <input type="radio" name="Gender" value="Female"
       <label>Female</label>

       <input type="radio" name="Gender" value="Other"
       <lable>Other</lable>
 <br><br>

       <lable>Select Courses</lable>
    <select>
        <option>B.tech</option>
        <option>M.tech</option>
        <option>MBA</option>
        <option>MCA</option>
        <option>Polytechnic Diploma</option>
    </select>

    <label>Select Hobbies </label>
    <input type="checkbox" name="hobby" value="coding">
    <label>Coding</label>

    <input type="checkbox" name="hobby" value="reading">
    <label>Reading</label>

    <input type="checkbox" name="hobby" value="playing">
    <label>Playing</label>

    <input type="checkbox" name="hobby" value="travelling">
    <label>Travelling</label>

    <input type="checkbox" name="hobby" value="other">
    <label>Other</label>
    <br><br>

    <label>Message </label>
    <textarea name="message" rows="5" cols="50"></textarea>
    <br><br>

    <input type="submit" value="Submit">
    </form>
    <p>Copyright &copy; 2026 Wainganga College Of Engineering And Management. All rights reserved.</p>
    
</body>
</html>
